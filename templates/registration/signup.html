
{% extends "base.html" %}

{% block title %}Sign Up | InSureRance{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-box">

        <h2>Create an Account</h2>
        <p>Join InSureRance and start learning about insurance.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="primary-btn">
                Create Account
            </button>
        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

    </div>
</div>

{% endblock %}
